<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fixtures · FPL</title>
  <meta name="description" content="Fantasy Premier League fixtures by gameweek.">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="fixtures">
  <header class="site">
    <a class="brand" href="/">FPL</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main>
    <h1>Fixtures</h1>

    <div class="gw">
      <button id="prev" type="button" aria-label="Previous gameweek">‹ Prev</button>
      <strong id="gw">Loading…</strong>
      <button id="next" type="button" aria-label="Next gameweek">Next ›</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th class="r">Home</th><th class="c">Score / kick-off</th><th>Away</th></tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </main>

  <footer>
    Data from the official Fantasy Premier League API. Not affiliated with the Premier League.
  </footer>
</body>
</html>
