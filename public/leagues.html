<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mini-leagues · FPL</title>
  <meta name="description" content="Fantasy Premier League mini-league tables, team views and live points.">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
    <script src="/menu.js" defer></script>
  <script src="/team-view.js" defer></script>
  <script src="/leagues-table.js" defer></script>
</head>
<body data-page="league-table">
  <header class="site">
    <a class="brand" href="/">FPL</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main>
    <h1 id="title" class="lt-title">Mini-leagues</h1>

    <div class="lt-bar">
      <form id="find" class="lt-find">
        <label class="sr" for="id">League ID</label>
        <input id="id" inputmode="numeric" placeholder="League ID" autocomplete="off">
        <button type="submit">View</button>
      </form>

      <div id="mine" class="lg-dd" hidden>
        <button id="lg-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="lg-menu">
          <span id="lg-label">Leagues</span><span class="chev" aria-hidden="true">▾</span>
        </button>
        <div id="lg-menu" class="lg-menu" hidden>
          <div class="lg-head">My leagues</div>
          <ul id="mine-list"></ul>
        </div>
      </div>
    </div>

    <p class="meta" id="meta">Enter a classic league ID, or pick one of your leagues.</p>

    <div class="lt-table-wrap">
      <table class="lt-table">
        <thead>
          <tr>
            <th class="lt-name-h">Name</th>
            <th class="c">Points</th>
            <th class="c lt-sorted">Rank ▲</th>
            <th>Transfers</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <p class="gw"><button id="more-league" type="button" hidden>Show more</button></p>
    <p class="gw">
      <button id="prev" type="button" hidden>‹ Previous</button>
      <button id="next" type="button" hidden>Next ›</button>
    </p>
  </main>

  <footer>
    Data from the official Fantasy Premier League API. Not affiliated with the Premier League.
  </footer>
</body>
</html>
