<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Planner · FPL</title>
  <meta name="description" content="Fantasy Premier League season ticker and fixtures.">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
  <script src="/planner.js" defer></script>
</head>
<body data-page="planner">
  <header class="site">
    <a class="brand" href="/">FPL</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main>
    <h1>Planner</h1>

    <section>
      <div class="ticker-head">
        <h2>Season ticker</h2>
        <div class="stepper">
          <span class="label">Gameweeks</span>
          <button id="gw-minus" type="button" aria-label="Fewer gameweeks">−</button>
          <strong id="gw-count">5</strong>
          <button id="gw-plus" type="button" aria-label="More gameweeks">+</button>
        </div>
      </div>

      <div class="tk-wrap">
        <table class="tk">
          <thead id="tk-head"></thead>
          <tbody id="tk-body"></tbody>
        </table>
      </div>
      <p class="meta">Each cell shows the opponent and venue. Uppercase is home, lowercase is away. Colours follow FPL's difficulty rating.</p>
    </section>

    <section>
      <div class="ticker-head">
        <h2>Fixtures</h2>
        <div class="stepper">
          <button id="fx-prev" type="button" aria-label="Previous gameweek">‹</button>
          <strong id="fx-gw">Gameweek</strong>
          <button id="fx-next" type="button" aria-label="Next gameweek">›</button>
        </div>
      </div>
      <div id="fx-list"></div>
    </section>
  </main>

  <footer>
    Data from the official Fantasy Premier League API. Not affiliated with the Premier League.
  </footer>
</body>
</html>
