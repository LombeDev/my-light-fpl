
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FPL Fixture Difficulty · FPL</title>
  <meta name="description" content="Fantasy Premier League fixture difficulty grid. Compare every team's fixtures across gameweeks, coloured by difficulty.">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
     <script src="/menu.js" defer></script>
  <script src="/planner.js" defer></script>
</head>
<body data-page="planner">
  <header class="site">
    <a class="brand" href="/">FPL</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main class="fx">
    <h1>FPL Fixture Difficulty (FDR)</h1>
    <p class="fx-intro">Compare every team's fixtures across gameweeks. Each fixture is coloured by its difficulty, from 1 (easiest) to 5 (hardest).</p>

    <section class="fx-panel" aria-label="Grid options">
      <div class="fx-group">
        <span class="fx-label" id="fx-view-l">View</span>
        <div class="fx-seg" role="group" aria-labelledby="fx-view-l">
          <button type="button" data-view="simple" aria-pressed="false">Simple</button>
          <button type="button" data-view="detailed" aria-pressed="true">Detailed</button>
        </div>
      </div>

      <div class="fx-group">
        <label class="fx-label" for="fx-deadlines">Deadlines</label>
        <input class="fx-switch" id="fx-deadlines" type="checkbox" role="switch" checked>
      </div>

      <div class="fx-group">
        <label class="fx-label" for="fx-ko">KO times</label>
        <input class="fx-switch" id="fx-ko" type="checkbox" role="switch" checked>
      </div>

      <div class="fx-group">
        <label class="fx-label" for="fx-runs">Fixture runs</label>
        <input class="fx-switch" id="fx-runs" type="checkbox" role="switch" disabled title="Coming soon">
      </div>

      <div class="fx-group">
        <span class="fx-label" id="fx-gw-l">Gameweeks</span>
        <div class="fx-range" role="group" aria-labelledby="fx-gw-l">
          <label class="sr-only" for="fx-from">From gameweek</label>
          <select id="fx-from"></select>
          <span aria-hidden="true">to</span>
          <label class="sr-only" for="fx-to">To gameweek</label>
          <select id="fx-to"></select>
        </div>
        <p class="fx-hint">Up to 10 gameweeks at a time.</p>
      </div>
    </section>

    <ul class="fx-legend" aria-label="Colour key">
      <li><span class="fx-sw fx-d1"></span>1 very easy</li>
      <li><span class="fx-sw fx-d2"></span>2 easy</li>
      <li><span class="fx-sw fx-d3"></span>3 average</li>
      <li><span class="fx-sw fx-d4"></span>4 hard</li>
      <li><span class="fx-sw fx-d5"></span>5 very hard</li>
    </ul>

    <div class="fx-wrap">
      <table class="fx-table" id="fx-table">
        <thead id="fx-head"></thead>
        <tbody id="fx-body"></tbody>
      </table>
    </div>

    <p class="fx-note" id="fx-note"></p>
  </main>

 
</body>
</html>
