
  <!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fixture difficulty · FPL</title>
  <meta name="description" content="Fantasy Premier League fixture difficulty grid. Compare teams across gameweeks, with each fixture coloured by difficulty.">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
   <script src="/menu.js" defer></script>
  <script src="/planner.js" defer></script>
</head>
<body data-page="planner">
  <header class="site">
    <a class="brand" href="/">FPL</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main class="fd">
    <h1>Fixture difficulty</h1>
    <p class="fd-intro">Plan transfers and captains with a grid of every team's fixtures. Each fixture is coloured by its difficulty, from 1 (easiest) to 5 (hardest).</p>

    <section class="fd-controls" aria-label="Grid options">
      <div class="fd-group">
        <span class="fd-label" id="fd-view-label">View</span>
        <div class="fd-seg" role="group" aria-labelledby="fd-view-label">
          <button type="button" data-view="simple" aria-pressed="true">Simple</button>
          <button type="button" data-view="detailed" aria-pressed="false">Detailed</button>
        </div>
      </div>

      <div class="fd-group">
        <span class="fd-label" id="fd-gw-label">Gameweeks</span>
        <div class="fd-range" role="group" aria-labelledby="fd-gw-label">
          <label class="sr-only" for="fd-from">From gameweek</label>
          <select id="fd-from"></select>
          <span aria-hidden="true">to</span>
          <label class="sr-only" for="fd-to">To gameweek</label>
          <select id="fd-to"></select>
        </div>
        <p class="fd-hint">Up to 10 gameweeks at a time.</p>
      </div>
    </section>

    <ul class="fd-legend" aria-label="Colour key">
      <li><span class="fd-swatch fd-d1"></span>1 very easy</li>
      <li><span class="fd-swatch fd-d2"></span>2 easy</li>
      <li><span class="fd-swatch fd-d3"></span>3 average</li>
      <li><span class="fd-swatch fd-d4"></span>4 hard</li>
      <li><span class="fd-swatch fd-d5"></span>5 very hard</li>
      <li><span class="fd-swatch fd-blank"></span>blank</li>
    </ul>

    <div class="fd-wrap">
      <table class="fd-table">
        <thead id="fd-head"></thead>
        <tbody id="fd-body"></tbody>
      </table>
    </div>

    <p class="fd-note" id="fd-note"></p>
  </main>

 
</body>
</html>
