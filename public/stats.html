<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stats · FPL</title>
  <meta name="description" content="Fantasy Premier League player stats, ownership, double and blank gameweeks.">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
  <script src="/stats.js" defer></script>
</head>
<body data-page="stats">
  <header class="site">
    <a class="brand" href="/">FPL</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main>
    <h1>Stats</h1>

    <div class="st-toggle">
      <label for="photo">Player photo</label>
      <input id="photo" type="checkbox" checked>
    </div>

    <div class="st-tools">
      <select id="pos" aria-label="Position">
        <option value="0">Position</option>
      </select>
      <select id="team" aria-label="Team">
        <option value="0">All teams</option>
      </select>
    </div>

    <div class="st-tools">
      <select id="gw-from" aria-label="From gameweek"></select>
      <span class="st-dash" aria-hidden="true">-</span>
      <select id="gw-to" aria-label="To gameweek"></select>
      <select id="stat" aria-label="Sort by"></select>
    </div>

    <div class="st-tools st-actions">
      <button id="add-col" type="button" class="st-plus" aria-label="Add the sort stat as a column">+</button>
      <button id="preset" type="button" class="st-preset">Load Preset</button>
    </div>

    <p class="meta" id="meta">Loading…</p>
    <p class="meta">The gameweek range uses season totals until per-gameweek points are stored.</p>

    <div class="st-table-wrap">
      <table class="st-table">
        <thead id="st-head"></thead>
        <tbody id="st-body"></tbody>
      </table>
    </div>
    <p class="gw"><button id="st-more" type="button" hidden>Show more</button></p>
  </main>

  <footer>
    Data from the official Fantasy Premier League API. Not affiliated with the Premier League.
  </footer>
</body>
</html>
