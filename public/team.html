<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My team · FPL</title>
  <meta name="description" content="Your Fantasy Premier League team with live rank, live points, bonus, defensive contributions, transfers and the gameweek summary.">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
  <script src="/my-team.js" defer></script>
</head>
<body data-page="team-view" class="fplgw-body">
  <header class="site fplgw-topbar">
    <div class="fplgw-topbar-left">
      <a class="brand" href="/">FPL</a>
      <nav id="nav" aria-label="Main"></nav>
    </div>

    <div class="fplgw-topbar-right">
      <label class="mtl-toggle fplgw-mini-toggle">
        <span>Names</span>
        <input id="mtl-names" type="checkbox" role="switch" checked>
      </label>
      <span class="mtl-meta" id="mtl-updated"></span>
      <button type="button" class="mtl-iconbtn" id="mtl-refresh" aria-label="Refresh my team">⟳</button>

      <select id="fplgw-league-select" class="fplgw-blue-select" aria-label="Select league">
        <option value="101712">Kopala EPL (101712)</option>
        <option value="287414">League 287414</option>
      </select>

      <select id="fplgw-gw-select" class="fplgw-blue-select" aria-label="Select gameweek">
        <option value="">Current GW</option>
      </select>

      <div class="fplgw-more-wrap">
        <button type="button" id="fplgw-more-btn" class="fplgw-more-btn" aria-expanded="false">More ▾</button>
        <div id="fplgw-more-menu" class="fplgw-dropdown" hidden>
          <button type="button" data-action="summary">GW Summary &amp; Transfers</button>
          <button type="button" data-action="standings">Refresh Standings</button>
          <button type="button" data-action="top">Back to Top</button>
        </div>
      </div>
    </div>
  </header>

  <main class="mtl fplgw-main" id="mtl">
    <p class="mtl-note" id="mtl-note" role="status"></p>

    <div class="fplgw-grid">
      <!-- LEFT COLUMN: League Standings -->
      <aside class="fplgw-panel fplgw-col-left" aria-labelledby="fplgw-league-h">
        <div class="fplgw-panel-head">
          <h2 id="fplgw-league-h">League Standings</h2>
          <select id="fplgw-view-mode" class="fplgw-view-select" aria-label="Standings view mode">
            <option value="standard">☰ Standard View</option>
            <option value="compact">▤ Compact View</option>
            <option value="season">▦ Season View</option>
          </select>
        </div>
        <div id="fplgw-standings" class="fplgw-standings-wrap">
          <p class="mtl-empty">Loading standings…</p>
        </div>
      </aside>

      <!-- CENTER COLUMN: Manager Overview + Table / Pitch View -->
      <section class="fplgw-panel fplgw-col-center" aria-labelledby="fplgw-team-h">
        <div class="fplgw-panel-head">
          <div class="fplgw-team-heading">
            <h2 id="fplgw-team-h"><span id="mtl-team">My Team</span></h2>
            <span class="fplgw-mgr-sub" id="mtl-name">–</span>
          </div>

          <label class="fplgw-switch-wrap" title="Switch between Table and Kopala Pitch View">
            <input type="checkbox" id="fplgw-pitch-toggle">
            <span class="fplgw-switch-slider"></span>
            <span class="fplgw-switch-label">Pitch View</span>
          </label>
        </div>

        <!-- Manager Summary Header + GW Net & Safety Boxes -->
        <div class="fplgw-mgr-summary">
          <dl class="fplgw-meta-list">
            <div><dt>Total Points</dt><dd id="mtl-total">–</dd></div>
            <div><dt>GW Points</dt><dd id="mtl-gwlive">–</dd></div>
            <div><dt>Live Rank</dt><dd id="mtl-rank">–</dd></div>
            <div><dt>Chip</dt><dd id="fplgw-chip">–</dd></div>
            <div><dt>Transfers</dt><dd id="fplgw-tr-summary">–</dd></div>
          </dl>

          <div class="fplgw-net-boxes">
            <div class="fplgw-net-box">
              <small>GW Net</small>
              <strong id="fplgw-gw-net">–</strong>
            </div>
            <div class="fplgw-safety-box">
              <small>Safety</small>
              <strong id="fplgw-safety">–</strong>
            </div>
          </div>
        </div>

        <!-- VIEW A: Player Table (Default, matching fplgameweek.com) -->
        <div id="fplgw-table-view" class="fplgw-table-view">
          <table class="fplgw-player-table">
            <thead>
              <tr>
                <th>Player</th>
                <th>Status</th>
                <th>Pts</th>
                <th>Imp</th>
              </tr>
            </thead>
            <tbody id="fplgw-player-tbody"></tbody>
          </table>
        </div>

        <!-- VIEW B: Kopala FPL Pitch View (Your exact pitch.svg + compact cards) -->
        <div id="fplgw-pitch-view" class="fplgw-pitch-view" hidden>
          <div class="mtl-pitch-wrap">
            <img src="/pitch.svg" alt="" class="mtl-pitch-bg" aria-hidden="true">
            <div class="mtl-pitch-overlay">
              <div class="mtl-p-row" id="mtl-gkp"></div>
              <div class="mtl-p-row" id="mtl-def"></div>
              <div class="mtl-p-row" id="mtl-mid"></div>
              <div class="mtl-p-row" id="mtl-fwd"></div>
            </div>
          </div>

          <div class="mtl-bench-strip">
            <div class="mtl-bench-label">Bench</div>
            <div class="mtl-p-row mtl-p-row--bench" id="mtl-bench"></div>
          </div>
        </div>

        <!-- Transfers & GW Summary Drawer/Section below team -->
        <div id="fplgw-extra-drawer" class="fplgw-extra-drawer">
          <div class="fplgw-subcard">
            <h3>Gameweek Transfers</h3>
            <div id="mtl-tr"></div>
          </div>
          <div class="fplgw-subcard">
            <h3>Gameweek Summary (Starting XI)</h3>
            <div id="mtl-sum"></div>
          </div>
        </div>
      </section>

      <!-- RIGHT COLUMN: My Feed & Matches -->
      <aside class="fplgw-col-right">
        <section class="fplgw-panel fplgw-feed-panel" aria-labelledby="fplgw-feed-h">
          <div class="fplgw-panel-head">
            <h2 id="fplgw-feed-h">My Feed</h2>
          </div>
          <div id="fplgw-feed" class="fplgw-feed-list">
            <p class="mtl-empty">No live events yet.</p>
          </div>
        </section>

        <section class="fplgw-panel fplgw-matches-panel" aria-labelledby="fplgw-matches-h">
          <div class="fplgw-panel-head">
            <h2 id="fplgw-matches-h">Matches</h2>
          </div>
          <div id="fplgw-matches" class="fplgw-matches-list">
            <p class="mtl-empty">Loading matches…</p>
          </div>
        </section>
      </aside>
    </div>
  </main>


</body>
</html>
