<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My team · FPL</title>
  <meta name="description" content="Your Fantasy Premier League squad, points, rank, live figures, deadline and transfers.">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
  <script src="/team-view.js" defer></script>
  <script src="/my-team.js" defer></script>
</head>
<body data-page="team-view">
  <header class="site">
    <a class="brand" href="/">FPL</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main>
    <h1 id="team-name">My team</h1>
    <p class="meta" id="team-meta"></p>
    <p class="meta" id="team-note"></p>

    <section class="dl-box" aria-live="polite">
      <div class="dl-units">
        <div class="dl-unit"><span id="dl-d" class="dl-num">--</span><span class="dl-lbl">Days</span></div>
        <div class="dl-unit"><span id="dl-h" class="dl-num">--</span><span class="dl-lbl">Hours</span></div>
        <div class="dl-unit"><span id="dl-m" class="dl-num">--</span><span class="dl-lbl">Mins</span></div>
        <div class="dl-unit"><span id="dl-s" class="dl-num">--</span><span class="dl-lbl">Secs</span></div>
      </div>
      <p class="dl-date" id="dl-date"></p>
    </section>

    <section id="content"></section>

    <section class="tr-section">
      <h2>Transfers in and out</h2>
      <p class="meta" id="tr-meta">Gameweek transfers across all managers.</p>
      <div class="tr-search">
        <input id="tr-q" type="search" placeholder="Search player" aria-label="Search player">
      </div>
      <div class="tr-wrap">
        <table class="tr-table">
          <thead id="tr-head"></thead>
          <tbody id="tr-body"></tbody>
        </table>
      </div>
      <p class="gw"><button id="tr-more" type="button" hidden>Show more</button></p>
    </section>
  </main>

  <footer>
    Data from the official Fantasy Premier League API. Not affiliated with the Premier League.
  </footer>
</body>
</html>
